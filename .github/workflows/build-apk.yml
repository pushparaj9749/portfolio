name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a GitHub release with the APK"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  apk:
    name: Assemble APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/kriya-release.keystore"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/kriya-release.keystore" >> "$GITHUB_ENV"

      - name: Decide build type
        id: kind
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "suffix=release" >> "$GITHUB_OUTPUT"
          else
            # Debug APKs are installable without any extra setup, so first-time
            # users always get something they can sideload.
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "suffix=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Version info
        id: version
        run: |
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon ${{ steps.kind.outputs.task }}

      - name: Rename artifact
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$SRC" ]; then echo "No APK produced"; exit 1; fi
          DEST="kriya-${{ steps.version.outputs.name }}-${{ steps.kind.outputs.suffix }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - uses: actions/upload-artifact@v4
        with:
          name: kriya-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Kriya ${{ steps.version.outputs.name }}
          body: |
            Kriya — Android automation with a UI that explains itself.

            **Install:** download `.apk` below, tap it on your phone and allow "install unknown apps" for your browser or files app.

            - Debug-signed builds are fine for personal use; add `KEYSTORE_BASE64`, `KEYSTORE_PASSWORD`, `KEY_ALIAS` and `KEY_PASSWORD` secrets for a properly signed release.
          files: ${{ steps.apk.outputs.path }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
